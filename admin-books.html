<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI 교회</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/3-pages/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        .book-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .book-table th, .book-table td { padding: 12px 16px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; vertical-align: middle; }
        .book-table th { background: #f8f9fa; font-weight: 600; color: #333; }
        .book-cover-thumb { width: 50px; height: 70px; object-fit: cover; display: block; }
        .book-cover-empty { width: 50px; height: 70px; background: #e8e8e8; display: block; }
        .book-action-btn { padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-edit { background: #182B8C; color: #fff; margin-right: 6px; }
        .btn-edit:hover { background: #0f1e6b; }
        .btn-delete { background: #fff; color: #e53e3e; border: 1px solid #e53e3e; }
        .btn-delete:hover { background: #e53e3e; color: #fff; }
        .books-add-btn { display: inline-block; padding: 10px 24px; background: #182B8C; color: #fff; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; margin-bottom: 8px; }
        .books-add-btn:hover { background: #0f1e6b; }
        .books-empty-msg { text-align: center; padding: 60px 0; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="admin-dashboard">
        <!-- Header -->
        <header class="admin-header">
            <div class="admin-header-container">
                <div class="admin-logo">
                    <a href="index.html"><img src="assets/images/logo/logo-blue.png" alt="AMI 교회"></a>
                </div>
                <nav class="admin-tabs">
                    <a href="admin-dashboard.html" class="admin-tab">동영상 목록</a>
                    <a href="admin-add.html" class="admin-tab">동영상 추가</a>
                    <a href="admin-books.html" class="admin-tab active">도서 목록</a>
                    <a href="admin-book-add.html" class="admin-tab">도서 추가</a>
                </nav>
            </div>
        </header>

        <!-- Content -->
        <main class="admin-content">
            <h1 class="page-title">도서 목록보기</h1>

            <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
                <a href="admin-book-add.html" class="books-add-btn">+ 도서 추가하기</a>
            </div>

            <div id="bookTableWrap">
                <div class="loading">도서 목록을 불러오는 중...</div>
            </div>
        </main>

        <footer class="admin-add-footer">
            © Copyrights 2025 AMI Missions International. All rights reserved.
        </footer>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="cancel-modal" id="deleteModal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="deleteModalClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="modal-body">
                <p class="modal-text">이 도서를 삭제하시겠습니까?<br>삭제 후 복구가 불가능합니다.</p>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-confirm" id="confirmDeleteBtn">삭제하기</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/admin-books.js"></script>
</body>
</html>
